<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'">
<title>COLLECTION_DAY truck routes · Review map</title><style>/* LEAFLET_CSS */</style>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8faf7;color:#193b37;font:14px system-ui,Arial,sans-serif}header{padding:14px 18px;border-bottom:1px solid #d5dfd8;background:white}h1{font-size:21px;margin:0 0 4px}header p{margin:0;color:#62766e;font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:12px}label{font-size:11px;display:flex;flex-direction:column;gap:4px}select,input,button{font:inherit}select,button{padding:7px 10px;background:white;border:1px solid #becfc5;border-radius:5px;color:#174d45;cursor:pointer}.toggle{flex-direction:row;align-items:center;align-self:center;font-size:12px}.metrics{margin-left:auto;font-size:12px;line-height:1.6;color:#426158}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100dvh - 145px);min-height:460px}#map{height:100%;background:#ecf0e5}aside{overflow:auto;padding:16px;border-left:1px solid #d5dfd8;background:white}h2{font-size:19px;margin:0 0 10px}h3{font-size:13px;margin:18px 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid small{display:block;color:#678075;font-size:10px}.grid b{font-size:17px}table{border-collapse:collapse;width:100%;font-size:11px}td,th{border-bottom:1px solid #d5dfd8;text-align:left;padding:8px 3px}.note{padding:9px;background:#f7f2e2;color:#805c28;border-radius:4px;font-size:11px;line-height:1.6}.good{background:#e5f2e8;color:#216849}#search{width:100%;padding:8px;border:1px solid #becfc5;border-radius:4px;margin:8px 0}.stop{display:block;width:100%;border:0;border-bottom:1px solid #e6ece7;text-align:left;padding:8px 0;font-size:11px}.stop small{display:block;color:#6c8177}.street-label{background:transparent;border:0;color:#5f6d65;font-size:9px;white-space:nowrap;text-shadow:0 0 3px white,0 0 3px white;pointer-events:none}.direction{background:transparent;border:0;font-size:20px;line-height:18px;font-weight:700;text-shadow:0 0 2px white;pointer-events:none}.site{border-radius:50%;background:white;border:2px solid #285f54;text-align:center;font-weight:bold;line-height:22px;font-size:10px}.badge{background:#fffffff2;padding:7px 10px;color:#547266;border:1px solid #d5dfd8;border-radius:4px;font:10px system-ui}.leaflet-popup-content{font:12px/1.6 system-ui}#fleet-status{margin-top:7px}.legend{font-size:10px;line-height:1.6;color:#62766e;margin-top:12px}@media(max-width:800px){.layout{grid-template-columns:1fr;height:auto}#map{height:65dvh}aside{max-height:45dvh}.metrics{margin-left:0}}
</style>
<header><h1>COLLECTION_DAY · Truck route review</h1><p>Pickup points, directed road travel and real disposal trips. One map, fully offline.</p>
<div class="controls"><label>Collection stream<select id="stream"><option value="garbage">Garbage · ASL</option><option value="recycling">Recycling · rear load</option></select></label>
<label>Truck<select id="truck"></select></label><label>Load<select id="load"><option value="all">All loads</option></select></label>
<button id="fit-service">Fit collection work</button><button id="fit-trip">Fit full trip</button>
<label class="toggle"><input id="show-points" type="checkbox" checked>Pickup points</label><label class="toggle"><input id="show-labels" type="checkbox" checked>Street names</label>
<div id="metrics" class="metrics"></div></div></header><div class="layout"><div id="map" aria-label="COLLECTION_DAY truck route map"></div><aside id="detail"></aside></div>
<script>/* LEAFLET_JS */</script><script id="data" type="application/json">"ROUTING_DATA"</script>
<script>
'use strict';
const D=JSON.parse(document.querySelector('#data').textContent),$=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>Number(n).toLocaleString('en-CA'),duration=s=>`${Math.floor(Math.round(s/60)/60)}h ${Math.round(s/60)%60}m`;
const colours=['#126e62','#4666a8','#aa7122','#8852a0','#b64d56','#337d97','#5d782e','#a06234'];
const map=L.map('map',{preferCanvas:true,zoomAnimation:false,fadeAnimation:false,maxZoom:19,minZoom:9});
map.attributionControl.setPrefix('');map.attributionControl.addAttribution('City of Winnipeg · OGL Winnipeg | Physical road reference: © OpenStreetMap contributors, local cache');
for(const [name,z] of [['context',210],['work',390],['route',402],['points',410],['labels',420]]){map.createPane(name);map.getPane(name).style.zIndex=z;}
map.getPane('labels').style.pointerEvents='none';
const contextRenderer=L.canvas({pane:'context'}),routeRenderer=L.canvas({pane:'route'}),pointRenderer=L.canvas({pane:'points'});
L.geoJSON(D.context,{pane:'context',renderer:contextRenderer,interactive:false,style:f=>{const k=f.properties.kind;return k==='park'?{color:'#cad6be',weight:.5,fillColor:'#dbe7d0',fillOpacity:.8}:k==='water_area'?{color:'#b7d8dd',fillColor:'#bedee1',weight:.5,fillOpacity:.9}:k==='waterway'?{color:'#bad4da',weight:3}:k==='railway'?{color:'#858e83',weight:1.4,dashArray:'4 4'}:k==='landuse'?{color:'#d4d4ca',weight:.6,fillColor:'#e4e2d7',fillOpacity:.5}:{color:'#fff',weight:1.6,opacity:.95};}}).addTo(map);
const badge=L.control({position:'topleft'});badge.onAdd=()=>{const e=L.DomUtil.create('div','badge');e.textContent='Offline map · zero external requests';return e;};badge.addTo(map);
let work=null,road=null,points=null,arrows=null,sites=null,labels=L.layerGroup().addTo(map),current=null,labelTimer;
const roads=D.context.features.filter(f=>f.properties.kind==='road'&&f.properties.name&&f.geometry.type==='LineString');
function roadLabels(){labels.clearLayers();if(!$('show-labels').checked||map.getZoom()<14)return;const occupied=new Set(),names=new Set(),bounds=map.getBounds();for(const r of roads){const c=r.geometry.coordinates[Math.floor(r.geometry.coordinates.length/2)],p=L.latLng(c[1],c[0]);if(!bounds.contains(p))continue;const xy=map.latLngToContainerPoint(p),key=Math.floor(xy.x/130)+':'+Math.floor(xy.y/38);if(occupied.has(key)||names.has(r.properties.name))continue;occupied.add(key);names.add(r.properties.name);L.marker(p,{pane:'labels',interactive:false,icon:L.divIcon({className:'street-label',html:escape(r.properties.name),iconSize:[130,15]})}).addTo(labels);if(names.size>=60)break;}}
map.on('moveend',()=>{clearTimeout(labelTimer);labelTimer=setTimeout(roadLabels,100);});
function clear(){for(const layer of [work,road,points,arrows,sites])if(layer)map.removeLayer(layer);work=road=points=arrows=sites=null;}
function selectStream(){const all=D.routes.filter(r=>r.stream===$('stream').value);$('truck').innerHTML='<option value="all">All trucks · territory overview</option>'+all.map(r=>`<option value="${r.id}">${r.id} · ${num(r.pickups)} pickups · ${r.return}</option>`).join('');const s=D.streams[$('stream').value];$('metrics').innerHTML=`<b>${s.trucks} trucks · ${num(Math.round(s.pickups/s.trucks))} pickups/truck</b><br>${s.paid_hours.toFixed(1)} paid worker hours · ${num(s.pickups)} pickups`;selectTruck();}
function selectTruck(){current=D.routes.find(r=>r.id===$('truck').value)||null;$('load').innerHTML='<option value="all">All loads</option>'+(current?current.loads.map(l=>`<option value="${l.load}">Load ${l.load} · ${num(l.pickups)} pickups</option>`).join(''):'');$('load').disabled=!current;render();fitService();}
function selectedStops(){return current?current.stops.filter(s=>$('load').value==='all'||s.Load===Number($('load').value)):[];}
function accessInfo(s){const offset=Number.isFinite(s.PickupOffsetM)?s.PickupOffsetM:map.distance([s.Latitude,s.Longitude],[s.PickupLatitude,s.PickupLongitude]);const unresolved=offset>80||/oneway_opposite|road_direction|street_name_unmatched|construction_tagged|ambiguous_property/.test(s.AccessIssues||'');return `${unresolved?'Pickup access unresolved':'Inferred right-curb service'} - ${Math.round(offset)} m from property${s.PickupRoad?' - '+s.PickupRoad:''}`;}
function showStop(s){map.setView([s.Latitude,s.Longitude],Math.max(map.getZoom(),17),{animate:false});L.popup().setLatLng([s.Latitude,s.Longitude]).setContent(`<b>${escape(s.Address)}</b><br>AddressId ${escape(s.AddressId)}<br>${current.id} · Load ${s.Load} · Pickup ${s.Sequence}<br>${escape(s.WorkArea)} · Planning ${escape(s.Section)}<br>Travel bearing ${s.TravelBearing}° · estimated ${escape(s.EstimatedServiceTime)}<br>${s.Latitude.toFixed(6)}, ${s.Longitude.toFixed(6)}<br>${escape(accessInfo(s))}${s.AccessIssues?'<br>'+escape(s.AccessIssues):''}`).openOn(map);}
function pointPopup(s){L.popup().setLatLng([s.Latitude,s.Longitude]).setContent(`<b>${escape(s.Address)}</b><br>ID ${escape(s.AddressId)} · ${current.id}<br>Load ${s.Load} · pickup ${s.Sequence}<br>${escape(s.WorkArea)} · ${escape(s.EstimatedServiceTime)}<br>Travel bearing ${s.TravelBearing}°<br>${escape(accessInfo(s))}${s.AccessIssues?'<br>'+escape(s.AccessIssues):''}`).openOn(map);}
function render(){clear();map.closePopup();const all=D.routes.filter(r=>r.stream===$('stream').value),owner=new Map(all.flatMap((r,i)=>r.sections.map(s=>[s,{route:r,colour:colours[i%colours.length]}]))),colour=current?colours[all.indexOf(current)%colours.length]:'#126e62';
work=L.geoJSON(D.areas,{pane:'work',bubblingMouseEvents:false,style:f=>{const o=owner.get(f.id);return {color:o?.colour||'#71837a',weight:current&&o?.route.id===current.id?2.5:1,fillColor:o?.colour||'#71837a',fillOpacity:current?(o?.route.id===current.id ? .18 : .025):.2};},onEachFeature:(f,l)=>l.on('click',e=>{L.DomEvent.stopPropagation(e);const o=owner.get(f.id);if(o){$('truck').value=o.route.id;selectTruck();L.popup().setLatLng(e.latlng).setContent(`<b>${escape(f.id)} · ${num(f.properties.addresses)} pickups</b><br>${escape(f.properties.name)}<br>${o.route.id}`).openOn(map);}})}).addTo(map);
if(!current){const early=all.filter(r=>r.early_seconds>0).length,late=all.filter(r=>r.late_seconds>0).length,low=all.flatMap(r=>r.loads).filter(l=>l.minimum_fill_met===false).length;$('detail').innerHTML=`<h2>${all.length} ${escape($('stream').value)} trucks</h2><p>Select a coloured territory or a truck above.</p><p>Preferred return ${escape(D.settings.preferred_return||D.settings.earliest_return)} to ${escape(D.settings.latest_return)}. ${D.streams[$('stream').value].comparison_trucks?`Comparison only: ${D.streams[$('stream').value].comparison_trucks} trucks.`:''}</p><p class="note ${!early&&!late&&!low?'good':''}">${early} before ${escape(D.settings.earliest_return)} · ${late} after ${escape(D.settings.latest_return)}. ${low} dump visits below the fill target. Exceptions remain unresolved; no waiting or extra trips were added to fill time.</p><table><thead><tr><th>Truck</th><th>Pickups</th><th>Return</th></tr></thead><tbody>${all.map(r=>`<tr><td><button class="truck-row" data-id="${r.id}">${r.id}</button></td><td>${num(r.pickups)}</td><td>${r.return}</td></tr>`).join('')}</tbody></table><p class="legend">Solid lines: collection travel. Dashed lines: yard/disposal travel. Points retain original property coordinates; inferred road-side positions are separate. All locations use the current curbside scenario.</p>`;for(const b of document.querySelectorAll('.truck-row'))b.onclick=()=>{$('truck').value=b.dataset.id;selectTruck();};return;}
const geometry={type:'FeatureCollection',features:current.geometry.features.filter(f=>$('load').value==='all'||f.properties.load===Number($('load').value))};
road=L.geoJSON(geometry,{pane:'route',renderer:routeRenderer,bubblingMouseEvents:false,style:f=>({color:colour,weight:f.properties.kind==='collection_drive'?3:2,opacity:.9,dashArray:f.properties.kind==='collection_drive'?null:'6 5'}),onEachFeature:(f,l)=>l.bindPopup(`${current.id} · Load ${f.properties.load}<br>${escape(f.properties.kind.replaceAll('_',' '))}`)}).addTo(map);
arrows=L.layerGroup().addTo(map);const lines=geometry.features.filter(f=>f.properties.kind==='collection_drive'),step=Math.max(1,Math.ceil(lines.length/65));for(let i=0;i<lines.length;i+=step){const c=lines[i].geometry.coordinates;let best=-1,n=0,dx=0,dy=0;for(let j=0;j<c.length-1;j++){const x=(c[j+1][0]-c[j][0])*Math.cos(c[j][1]*Math.PI/180),y=-(c[j+1][1]-c[j][1]);if(x*x+y*y>best){best=x*x+y*y;n=j;dx=x;dy=y;}}if(best<1e-16)continue;L.marker([c[n][1],c[n][0]],{interactive:false,icon:L.divIcon({className:'direction',html:`<span style="display:block;color:${colour};transform:rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)">➜</span>`,iconSize:[18,18]})}).addTo(arrows);}
points=L.layerGroup().addTo(map);if($('show-points').checked)for(const s of selectedStops())L.circleMarker([s.Latitude,s.Longitude],{pane:'points',renderer:pointRenderer,radius:3,stroke:false,fillColor:colour,fillOpacity:.85,bubblingMouseEvents:false}).on('click',e=>{L.DomEvent.stopPropagation(e);pointPopup(s);}).addTo(points);
sites=L.layerGroup().addTo(map);for(const key of ['yard',$('stream').value]){const s=D.sites[key];L.marker([s.coordinate[1],s.coordinate[0]],{icon:L.divIcon({className:'site',html:key==='yard'?'Y':'RF',iconSize:[26,26]})}).bindPopup(`<b>${escape(s.name)}</b><br>${escape(s.address)}`).addTo(sites);}
$('detail').innerHTML=`<h2>${current.id} · ${escape(current.equipment)}</h2><div class="grid"><div><small>Pickups</small><b>${num(current.pickups)}</b></div><div><small>Yard return</small><b>${current.return}</b></div><div><small>Paid time</small><b>${duration(current.paid_seconds)}</b></div><div><small>Distance</small><b>${current.km.toFixed(1)} km</b></div></div><p class="note ${!current.early_seconds&&!current.late_seconds?'good':''}">${current.early_seconds?`${Math.ceil(current.early_seconds/60)} minutes before the required return window.`:current.late_seconds?`${Math.ceil(current.late_seconds/60)} minutes past the deadline.`:'Within the required return window.'} Actual pickup, driving, unloading and breaks only.</p><h3>Work areas</h3><p style="font-size:11px">${escape(current.sections.join(' → '))}</p><h3>Loads and disposal</h3><table><tr><th>Load</th><th>Pickups / max</th><th>Fill</th><th>Unloaded</th></tr>${current.loads.map(l=>`<tr><td>${l.load}</td><td>${num(l.pickups)} / ${num(l.capacity)}</td><td>${l.fill_percent??Math.round(100*l.pickups/l.capacity)}%${l.minimum_fill_met===false?" - below target":""}</td><td>${l.unloaded}</td></tr>`).join('')}</table><details><summary style="margin-top:14px;cursor:pointer">Time breakdown</summary><p class="legend">Stationary pickup ${duration(current.pickup_seconds)}<br>Collection driving ${duration(current.collection_drive_seconds)}<br>Other driving ${duration(current.deadhead_seconds)}<br>Observed-pace allowance ${duration(current.collection_allowance_seconds)}<br>Unloading ${duration(current.unload_seconds)}<br>Breaks ${duration(current.break_seconds)}<br>Pretrip ${D.settings.pretrip_minutes} minutes<br>Overtime ${duration(current.overtime_seconds)}</p></details><h3>Find a pickup</h3><input id="search" placeholder="Address, source ID or pickup number"><div id="stops"></div><p class="legend">Planning estimate: curb access is inferred. One-way, truck restrictions and garbage mass remain explicit limitations. Route sequence is continuous across load breaks.</p>`;
$('search').oninput=stopList;stopList();}
function stopList(){const term=$('search').value.trim().toLowerCase(),found=selectedStops().filter(s=>!term||`${s.Address} ${s.AddressId} ${s.Sequence}`.toLowerCase().includes(term));$('stops').innerHTML=found.slice(0,70).map(s=>`<button class="stop" data-sequence="${s.Sequence}">${s.Sequence}. ${escape(s.Address)}<small>Load ${s.Load} · ${escape(s.WorkArea)} · ID ${escape(s.AddressId)}</small></button>`).join('')+(found.length>70?`<p class="legend">${num(found.length)} matches. Refine the search to see more.</p>`:'');for(const b of document.querySelectorAll('.stop'))b.onclick=()=>showStop(current.stops.find(s=>s.Sequence===Number(b.dataset.sequence)));}
function fitService(){const data=current?selectedStops():D.routes.filter(r=>r.stream===$('stream').value).flatMap(r=>r.stops);if(data.length)map.fitBounds(L.latLngBounds(data.map(s=>[s.Latitude,s.Longitude])),{padding:[35,35],maxZoom:17,animate:false});}

function inside(lon,lat,ring){let yes=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const [x,y]=ring[i],[a,b]=ring[j];if((y>lat)!==(b>lat)&&lon<(a-x)*(lat-y)/(b-y)+x)yes=!yes;}return yes;}
map.on('click',e=>{const f=D.areas.features.find(f=>(f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates).some(p=>inside(e.latlng.lng,e.latlng.lat,p[0])&&!p.slice(1).some(r=>inside(e.latlng.lng,e.latlng.lat,r))));if(!f)return;const r=D.routes.find(r=>r.stream===$('stream').value&&r.sections.includes(f.id));if(r){$('truck').value=r.id;selectTruck();L.popup().setLatLng(e.latlng).setContent(`<b>${escape(f.id)}</b><br>${num(f.properties.addresses)} pickups<br>${escape(f.properties.name)}<br>${r.id}`).openOn(map);}});
$('stream').onchange=selectStream;$('truck').onchange=selectTruck;$('load').onchange=()=>{render();fitService();};$('show-points').onchange=render;$('show-labels').onchange=roadLabels;$('fit-service').onclick=fitService;$('fit-trip').onclick=()=>{if(road?.getBounds().isValid())map.fitBounds(road.getBounds(),{padding:[35,35],animate:false});};selectStream();
</script></html>
